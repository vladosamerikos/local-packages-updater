name: Publicar paquete Debian

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - name: Obtener código
        uses: actions/checkout@v7

      - name: Comprobar versión de la etiqueta
        run: |
          version=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Instalar bibliotecas de compilación
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            liblzma-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config

      - name: Compilar paquete
        run: ./scripts/build-linux.sh

      - name: Verificar paquete y generar checksum
        run: |
          version=${GITHUB_REF_NAME#v}
          deb="artifacts/Actualizaciones_${version}_amd64.deb"
          test -f "$deb"
          test "$(dpkg-deb -f "$deb" Version)" = "$version"
          test "$(dpkg-deb -f "$deb" Architecture)" = amd64
          dpkg-deb -c "$deb" > /tmp/actualizaciones-deb-manifest.txt
          grep -q 'usr/bin/actualizaciones-agent$' /tmp/actualizaciones-deb-manifest.txt
          grep -q 'usr/share/applications/es.vlad.actualizaciones.desktop$' /tmp/actualizaciones-deb-manifest.txt
          (
            cd artifacts
            sha256sum "Actualizaciones_${version}_amd64.deb" > "Actualizaciones_${version}_amd64.deb.sha256"
          )

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          deb="artifacts/Actualizaciones_${version}_amd64.deb"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$deb" "$deb.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$deb" "$deb.sha256" \
              --verify-tag --generate-notes --title "Actualizaciones $GITHUB_REF_NAME"
          fi
